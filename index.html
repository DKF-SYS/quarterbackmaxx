<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Quarterback Maxx: Handheld Field Goal Blitz</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    body {
      background: #0b0512;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      padding: 10px;
      overflow-x: hidden;
    }
    header {
      text-align: center;
      margin-bottom: 6px;
      width: 100%;
      max-width: 480px;
    }
    h1 {
      font-size: 1.2rem;
      color: #00f0ff;
      text-shadow: 0 0 8px #00f0ff, 0 0 15px #ff007f;
      letter-spacing: 0.5px;
    }
    .hud {
      display: flex;
      justify-content: space-around;
      font-size: 0.9rem;
      font-weight: bold;
      color: #ff007f;
      text-shadow: 0 0 6px #ff007f;
      margin-top: 2px;
    }
    .game-container {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 480px;
      background: rgba(18, 8, 30, 0.95);
      padding: 10px;
      border-radius: 12px;
      border: 2px solid #00f0ff;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
    }
    /* Side/Top Stage Panel */
    .character-stage {
      display: flex;
      width: 100%;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }
    .meters-panel {
      flex: 1;
      background: #120024;
      border: 1px solid #00f0ff;
      border-radius: 6px;
      padding: 4px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .meter-box {
      background: #000;
      border: 1px solid #ff007f;
      border-radius: 3px;
      padding: 2px 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: monospace;
      font-size: 0.75rem;
    }
    .meter-title { color: #00f0ff; }
    .meter-val {
      font-size: 0.95rem;
      font-weight: bold;
      color: #39ff14;
      text-shadow: 0 0 4px #39ff14;
    }
    .meter-val.miss {
      color: #ff0055;
      text-shadow: 0 0 4px #ff0055;
    }
    .character-stage img {
      width: 75px;
      height: 75px;
      object-fit: contain;
      filter: drop-shadow(0 0 8px rgba(255, 0, 127, 0.5));
    }
    .dialogue-box {
      font-size: 0.75rem;
      background: #120024;
      border: 1px solid #ff007f;
      color: #00f0ff;
      padding: 4px 6px;
      border-radius: 6px;
      text-align: center;
      width: 100%;
      margin-bottom: 6px;
    }
    /* Responsive Canvas Container */
    .canvas-wrapper {
      position: relative;
      width: 100%;
      max-width: 440px;
      aspect-ratio: 11 / 10;
    }
    canvas {
      width: 100%;
      height: 100%;
      border: 2px solid #ff007f;
      border-radius: 8px;
      touch-action: none;
    }
    /* Mobile Retro Touch Controls */
    .mobile-controls {
      display: flex;
      width: 100%;
      max-width: 440px;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
      gap: 10px;
    }
    .dpad {
      display: grid;
      grid-template-columns: repeat(3, 38px);
      grid-template-rows: repeat(2, 38px);
      gap: 4px;
    }
    .pad-btn {
      background: #120024;
      border: 1.5px solid #00f0ff;
      color: #00f0ff;
      font-weight: bold;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      box-shadow: 0 0 6px rgba(0, 240, 255, 0.3);
    }
    .pad-btn:active {
      background: #ff007f;
      color: #fff;
    }
    .action-btn {
      flex: 1;
      height: 80px;
      background: linear-gradient(135deg, #ff007f, #7928ca);
      color: #fff;
      border: 2px solid #00f0ff;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 0 12px rgba(255, 0, 127, 0.5);
      text-shadow: 0 0 5px #00f0ff;
    }
    .action-btn:active {
      transform: scale(0.96);
    }
    /* Controls Bar */
    .controls-bar {
      margin-top: 10px;
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 480px;
    }
    .btn {
      flex: 1;
      background: #120024;
      color: #fff;
      border: 1px solid #00f0ff;
      padding: 8px;
      font-size: 0.85rem;
      font-weight: bold;
      border-radius: 6px;
      text-align: center;
    }
    /* Modal Stats Popup */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.88);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 999;
      padding: 15px;
    }
    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    .modal {
      background: #120024;
      border: 2px solid #00f0ff;
      box-shadow: 0 0 25px #ff007f;
      border-radius: 12px;
      padding: 20px;
      width: 100%;
      max-width: 340px;
      text-align: center;
    }
    .modal h2 {
      color: #ff007f;
      text-shadow: 0 0 8px #ff007f;
      margin-bottom: 12px;
      font-size: 1.4rem;
    }
    .stat-row {
      display: flex;
      justify-content: space-between;
      margin: 8px 0;
      font-size: 0.95rem;
      border-bottom: 1px dashed rgba(0, 240, 255, 0.3);
      padding-bottom: 4px;
    }
    .stat-value { color: #00f0ff; font-weight: bold; }
  </style>
</head>
<body>

  <header>
    <h1>QUARTERBACK MAXX: FIELD GOAL BLITZ</h1>
    <div class="hud">
      <div>SCORE: <span id="score">0</span></div>
      <div>CHANCES: <span id="chances">10</span></div>
    </div>
  </header>

  <div class="game-container">
    <div class="dialogue-box" id="dialogue">Position player & tap SNAP / KICK!</div>

    <div class="character-stage">
      <div class="meters-panel">
        <div class="meter-box">
          <span class="meter-title">PASSES:</span>
          <span class="meter-val" id="meter-passes">0</span>
        </div>
        <div class="meter-box">
          <span class="meter-title">MISSES:</span>
          <span class="meter-val miss" id="meter-misses">0</span>
        </div>
      </div>
      <img id="maxx-img" src="quarterbackmaxxmgmtoken.png" alt="Quarterback Maxx">
    </div>

    <div class="canvas-wrapper">
      <canvas id="gameCanvas" width="440" height="400"></canvas>
    </div>

    <!-- On-Screen Controls for Mobile Phones -->
    <div class="mobile-controls">
      <div class="dpad">
        <div></div>
        <button class="pad-btn" onclick="movePlayer(0, -15)">▲</button>
        <div></div>
        <button class="pad-btn" onclick="movePlayer(-15, 0)">◄</button>
        <button class="pad-btn" onclick="movePlayer(0, 15)">▼</button>
        <button class="pad-btn" onclick="movePlayer(15, 0)">►</button>
      </div>
      <button class="action-btn" onclick="triggerAction()">KICK / SNAP</button>
    </div>
  </div>

  <div class="controls-bar">
    <button class="btn" onclick="resetGame()">RESET DRIVE</button>
    <button class="btn" onclick="showStats()">STATS</button>
  </div>

  <div class="modal-overlay" id="statsModal">
    <div class="modal">
      <h2>DRIVE STATS</h2>
      <div class="stat-row"><span>Final Score:</span><span class="stat-value" id="stat-score">0</span></div>
      <div class="stat-row"><span>Passes / Goals:</span><span class="stat-value" id="stat-passes">0</span></div>
      <div class="stat-row"><span>Missed Passes:</span><span class="stat-value" id="stat-misses">0</span></div>
      <div class="stat-row"><span>Completion:</span><span class="stat-value" id="stat-rate">0%</span></div>
      <br>
      <button class="btn" onclick="closeStats()">NEW DRIVE</button>
    </div>
  </div>

  <script>
    // Sound Engine (Retro LED Handheld Beeps)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq, type, duration) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type || 'square';
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + duration);
    }

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const lineOfScrimmageY = 300;
    let score = 0, chances = 10, passes = 0, misses = 0;
    let isAiming = false;

    const mgmCoinImg = new Image();
    mgmCoinImg.src = 'tranparent mgm coin1.jpg';

    let token = { x: 220, y: 350, radius: 14, vx: 0, vy: 0, inAir: false, scale: 1, rotation: 0 };
    let playerPos = { x: 220, y: 350 };
    let dragStart = { x: 0, y: 0 }, dragCurrent = { x: 0, y: 0 };

    const goalpost = { xMin: 160, xMax: 280, y: 40, crossbarY: 58 };

    const defenders = [];
    function initDefenders() {
      defenders.length = 0;
      const yPositions = [90, 130, 170, 210, 240, 265, 285];
      for (let i = 0; i < 7; i++) {
        defenders.push({
          x: Math.random() * 300 + 40,
          y: yPositions[i],
          width: 32,
          height: 14,
          vx: (Math.random() > 0.5 ? 1 : -1) * (1.6 + Math.random() * 1.2),
          color: i % 2 === 0 ? '#ff0055' : '#7928ca'
        });
      }
    }
    initDefenders();

    function movePlayer(dx, dy) {
      if (token.inAir) return;
      playerPos.x = Math.max(30, Math.min(canvas.width - 30, playerPos.x + dx));
      playerPos.y = Math.max(lineOfScrimmageY, Math.min(canvas.height - 25, playerPos.y + dy));
      token.x = playerPos.x;
      token.y = playerPos.y;
      playBeep(200, 'square', 0.03);
    }

    function triggerAction() {
      if (token.inAir || chances <= 0) return;
      token.vx = (Math.random() - 0.5) * 2;
      token.vy = -7.5;
      token.inAir = true;
      chances--;
      document.getElementById('chances').textContent = chances;
      document.getElementById('dialogue').textContent = '"KICK IS UP!"';
      playBeep(320, 'square', 0.08);
    }

    // Touch Drag Controls directly on Canvas
    canvas.addEventListener('touchstart', (e) => {
      if (token.inAir || chances <= 0) return;
      const rect = canvas.getBoundingClientRect();
      const touch = e.touches[0];
      const tx = (touch.clientX - rect.left) * (canvas.width / rect.width);
      const ty = (touch.clientY - rect.top) * (canvas.height / rect.height);

      if (ty >= lineOfScrimmageY) {
        playerPos.x = tx; playerPos.y = ty;
        token.x = tx; token.y = ty;
        isAiming = true;
        dragStart = { x: tx, y: ty };
        dragCurrent = { x: tx, y: ty };
      }
    });

    canvas.addEventListener('touchmove', (e) => {
      if (!isAiming) return;
      const rect = canvas.getBoundingClientRect();
      const touch = e.touches[0];
      dragCurrent = {
        x: (touch.clientX - rect.left) * (canvas.width / rect.width),
        y: (touch.clientY - rect.top) * (canvas.height / rect.height)
      };
    });

    canvas.addEventListener('touchend', () => {
      if (!isAiming) return;
      isAiming = false;
      const dx = dragStart.x - dragCurrent.x;
      const dy = dragStart.y - dragCurrent.y;
      if (Math.hypot(dx, dy) > 10) {
        token.vx = dx * 0.12;
        token.vy = dy * 0.12;
        token.inAir = true;
        chances--;
        document.getElementById('chances').textContent = chances;
        document.getElementById('dialogue').textContent = '"TOKEN IN FLIGHT!"';
        playBeep(350, 'square', 0.08);
      }
    });

    function recordOutcome(success) {
      if (success) {
        score += 300; passes++;
        document.getElementById('score').textContent = score;
        document.getElementById('meter-passes').textContent = passes;
        document.getElementById('dialogue').textContent = '"FIELD GOAL IS GOOD! +300"';
        playBeep(523, 'square', 0.15);
      } else {
        misses++;
        document.getElementById('meter-misses').textContent = misses;
        document.getElementById('dialogue').textContent = '"NO GOOD! Pass missed!"';
        playBeep(130, 'sawtooth', 0.15);
      }
      resetToken();
    }

    function resetToken() {
      token.x = playerPos.x;
      token.y = playerPos.y;
      token.vx = 0; token.vy = 0;
      token.scale = 1; token.inAir = false;
      if (chances <= 0) setTimeout(showStats, 600);
    }

    function resetGame() {
      score = 0; chances = 10; passes = 0; misses = 0;
      document.getElementById('score').textContent = '0';
      document.getElementById('chances').textContent = '10';
      document.getElementById('meter-passes').textContent = '0';
      document.getElementById('meter-misses').textContent = '0';
      closeStats(); initDefenders(); resetToken();
    }

    function showStats() {
      document.getElementById('stat-score').textContent = score;
      document.getElementById('stat-passes').textContent = passes;
      document.getElementById('stat-misses').textContent = misses;
      let total = passes + misses;
      document.getElementById('stat-rate').textContent = (total > 0 ? Math.round((passes / total) * 100) : 0) + '%';
      document.getElementById('statsModal').classList.add('active');
    }

    function closeStats() { document.getElementById('statsModal').classList.remove('active'); }

    function update() {
      defenders.forEach(d => {
        d.x += d.vx;
        if (d.x < 15 || d.x + d.width > canvas.width - 15) d.vx *= -1;
      });

      if (token.inAir) {
        token.x += token.vx;
        token.y += token.vy;
        token.vy += 0.22;
        token.rotation += 0.2;
        token.scale = Math.max(0.6, token.scale - 0.005);

        defenders.forEach(d => {
          if (token.x > d.x && token.x < d.x + d.width && token.y > d.y && token.y < d.y + d.height) {
            token.vy *= -0.8; token.vx *= 1.2;
            playBeep(220, 'square', 0.04);
          }
        });

        if (token.y <= goalpost.crossbarY + 8 && token.y >= goalpost.y - 10) {
          if (token.x >= goalpost.xMin + 4 && token.x <= goalpost.xMax - 4) {
            recordOutcome(true); return;
          }
        }
        if (token.y > canvas.height + 20 || token.y < 5 || token.x < 0 || token.x > canvas.width) {
          recordOutcome(false);
        }
      }
    }

    function draw() {
      ctx.fillStyle = '#0f3818';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.lineWidth = 2; ctx.strokeStyle = '#ffffff';
      ctx.strokeRect(10, 10, canvas.width - 20, canvas.height - 20);

      ctx.beginPath();
      ctx.moveTo(10, lineOfScrimmageY); ctx.lineTo(canvas.width - 10, lineOfScrimmageY);
      ctx.strokeStyle = '#00f0ff'; ctx.lineWidth = 2; ctx.stroke();

      ctx.strokeStyle = '#ffd700'; ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(goalpost.xMin, goalpost.y); ctx.lineTo(goalpost.xMin, goalpost.crossbarY);
      ctx.lineTo(goalpost.xMax, goalpost.crossbarY); ctx.lineTo(goalpost.xMax, goalpost.y);
      ctx.moveTo((goalpost.xMin + goalpost.xMax) / 2, goalpost.crossbarY);
      ctx.lineTo((goalpost.xMin + goalpost.xMax) / 2, goalpost.crossbarY + 18);
      ctx.stroke();

      defenders.forEach(d => {
        ctx.fillStyle = d.color;
        ctx.fillRect(d.x, d.y, d.width, d.height);
      });

      // Draw Player Quarterback Marker
      if (!token.inAir) {
        ctx.fillStyle = '#00f0ff';
        ctx.beginPath(); ctx.arc(playerPos.x, playerPos.y, 8, 0, Math.PI * 2); ctx.fill();
      }

      ctx.save();
      ctx.translate(token.x, token.y);
      ctx.scale(token.scale, token.scale);
      ctx.rotate(token.rotation);

      if (mgmCoinImg.complete && mgmCoinImg.naturalWidth > 0) {
        ctx.drawImage(mgmCoinImg, -token.radius, -token.radius, token.radius * 2, token.radius * 2);
      } else {
        ctx.beginPath(); ctx.arc(0, 0, token.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#ffd700'; ctx.fill();
      }
      ctx.restore();
    }

    function loop() { update(); draw(); requestAnimationFrame(loop); }
    loop();
  </script>
</body>
</html>
