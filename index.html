<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Quarterback Maxx: Electronic Handheld</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    body {
      background: #05020a;
      color: #fff;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 10px;
      overflow-x: hidden;
    }

    /* Outer Handheld Console Plastic Shell */
    .handheld-console {
      width: 100%;
      max-width: 380px;
      background: linear-gradient(180deg, #d8ccb0 0%, #b5a482 100%);
      border: 4px solid #544733;
      border-radius: 24px;
      padding: 16px 14px 20px 14px;
      box-shadow: inset 0 2px 5px rgba(255,255,255,0.6), 0 10px 25px rgba(0,0,0,0.8);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Handheld Header Branding */
    .brand-plate {
      width: 100%;
      background: #1a0808;
      border: 2px solid #8b0000;
      border-radius: 6px;
      padding: 6px;
      text-align: center;
      margin-bottom: 12px;
      box-shadow: inset 0 0 8px #000;
    }
    .brand-title {
      font-weight: bold;
      font-size: 1.1rem;
      color: #ff3333;
      letter-spacing: 2px;
      text-shadow: 0 0 6px #ff0000;
    }
    .brand-sub {
      font-size: 0.65rem;
      color: #ffd700;
      letter-spacing: 1px;
    }

    /* Top Stats & Meters Bezel */
    .meters-bezel {
      width: 100%;
      background: #111;
      border: 2px solid #333;
      border-radius: 6px;
      padding: 6px;
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .led-meter {
      background: #050000;
      border: 1px solid #440000;
      padding: 2px 6px;
      border-radius: 4px;
      text-align: center;
    }
    .led-label {
      font-size: 0.6rem;
      color: #888;
      display: block;
    }
    .led-num {
      font-size: 1.1rem;
      color: #ff2222;
      text-shadow: 0 0 6px #ff0000;
      font-weight: bold;
    }

    /* Screen Housing Frame */
    .screen-housing {
      width: 100%;
      background: #020f04;
      border: 4px solid #1c2e1f;
      border-radius: 12px;
      padding: 8px;
      box-shadow: inset 0 0 15px #000;
      position: relative;
    }
    canvas {
      width: 100%;
      height: auto;
      aspect-ratio: 3 / 4;
      display: block;
      background: #041407;
      border-radius: 4px;
    }

    /* Dialogue Text Display */
    .status-readout {
      margin-top: 8px;
      font-size: 0.7rem;
      color: #39ff14;
      text-shadow: 0 0 4px #39ff14;
      text-align: center;
      height: 16px;
    }

    /* Console Control Panel (Built onto Casing) */
    .control-panel {
      width: 100%;
      margin-top: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 8px;
    }

    /* Cross D-Pad */
    .dpad-container {
      display: grid;
      grid-template-columns: repeat(3, 36px);
      grid-template-rows: repeat(3, 36px);
      gap: 2px;
    }
    .dpad-btn {
      background: #333;
      border: 1px solid #111;
      color: #aaa;
      font-size: 0.9rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      box-shadow: inset 0 1px 2px rgba(255,255,255,0.3), 0 3px 0 #111;
      cursor: pointer;
    }
    .dpad-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #111;
      background: #222;
      color: #ff3333;
    }

    /* Big Action Button */
    .action-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .big-kick-btn {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ff4444, #990000);
      border: 3px solid #550000;
      color: #fff;
      font-weight: bold;
      font-size: 0.85rem;
      box-shadow: inset 0 2px 4px rgba(255,255,255,0.4), 0 5px 0 #330000;
      cursor: pointer;
    }
    .big-kick-btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #330000;
    }
    .btn-label {
      font-size: 0.65rem;
      color: #443b2d;
      font-weight: bold;
    }

    /* Auxiliary Reset / Stats Buttons */
    .aux-bar {
      margin-top: 14px;
      display: flex;
      gap: 12px;
      width: 100%;
    }
    .aux-btn {
      flex: 1;
      background: #665b49;
      color: #eeddcc;
      border: 1px solid #332d24;
      padding: 6px;
      font-size: 0.7rem;
      font-weight: bold;
      border-radius: 4px;
      box-shadow: 0 2px 0 #221e18;
      cursor: pointer;
    }
    .aux-btn:active {
      transform: translateY(1px);
      box-shadow: 0 1px 0 #221e18;
    }

    /* Stats Modal */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.85);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
      z-index: 99;
    }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal {
      background: #111;
      border: 2px solid #ff3333;
      border-radius: 8px;
      padding: 16px; width: 280px; text-align: center;
    }
    .modal h2 { color: #ff3333; font-size: 1.2rem; margin-bottom: 10px; }
    .stat-row { display: flex; justify-content: space-between; margin: 6px 0; font-size: 0.85rem; }
  </style>
</head>
<body>

  <!-- Physical Handheld Console Casing -->
  <div class="handheld-console">
    
    <div class="brand-plate">
      <div class="brand-title">ELECTRONIC QUARTERBACK</div>
      <div class="brand-sub">MAXXCO HANDHELD LED SYSTEM</div>
    </div>

    <!-- LED Meters Display Panel -->
    <div class="meters-bezel">
      <div class="led-meter">
        <span class="led-label">PASSES</span>
        <span class="led-num" id="meter-passes">00</span>
      </div>
      <div class="led-meter">
        <span class="led-label">MISSES</span>
        <span class="led-num" id="meter-misses">00</span>
      </div>
      <div class="led-meter">
        <span class="led-label">CHANCES</span>
        <span class="led-num" id="meter-chances">10</span>
      </div>
      <div class="led-meter">
        <span class="led-label">SCORE</span>
        <span class="led-num" id="meter-score">000</span>
      </div>
    </div>

    <!-- Green LED Screen Area -->
    <div class="screen-housing">
      <canvas id="gameCanvas" width="300" height="380"></canvas>
      <div class="status-readout" id="status-msg">READY. SNAP / KICK TOKEN!</div>
    </div>

    <!-- Controls Built On The Plastic Body -->
    <div class="control-panel">
      <!-- Cross Directional Pad -->
      <div class="dpad-container">
        <div></div>
        <button class="dpad-btn" onclick="moveQB(0, -12)">▲</button>
        <div></div>
        <button class="dpad-btn" onclick="moveQB(-12, 0)">◄</button>
        <div></div>
        <button class="dpad-btn" onclick="moveQB(12, 0)">►</button>
        <div></div>
        <button class="dpad-btn" onclick="moveQB(0, 12)">▼</button>
        <div></div>
      </div>

      <!-- Action Kick Button -->
      <div class="action-group">
        <button class="big-kick-btn" onclick="snapOrKick()">KICK</button>
        <span class="btn-label">SNAP / KICK</span>
      </div>
    </div>

    <!-- Console Auxiliary Buttons -->
    <div class="aux-bar">
      <button class="aux-btn" onclick="resetGame()">RESET GAME</button>
      <button class="aux-btn" onclick="showStats()">STATS</button>
    </div>
  </div>

  <!-- Stats Overlay Modal -->
  <div class="modal-overlay" id="statsModal">
    <div class="modal">
      <h2>DRIVE STATS</h2>
      <div class="stat-row"><span>SCORE:</span><span id="stat-score">0</span></div>
      <div class="stat-row"><span>PASSES:</span><span id="stat-passes">0</span></div>
      <div class="stat-row"><span>MISSES:</span><span id="stat-misses">0</span></div>
      <div class="stat-row"><span>RATE:</span><span id="stat-rate">0%</span></div>
      <br>
      <button class="aux-btn" onclick="closeStats()">CONTINUE</button>
    </div>
  </div>

  <script>
    // Audio Synthesizer for LED Handheld Sounds
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq, type, duration) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type || 'square';
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + duration);
    }

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const lineOfScrimmageY = 280;
    let score = 0, chances = 10, passes = 0, misses = 0;

    const mgmCoinImg = new Image();
    mgmCoinImg.src = 'tranparent mgm coin1.jpg';

    let token = { x: 150, y: 320, radius: 10, vx: 0, vy: 0, inAir: false, rotation: 0 };
    let qbPos = { x: 150, y: 320 };

    const goalpost = { xMin: 110, xMax: 190, y: 35, crossbarY: 50 };

    // 7 Red LED Defender Dashes
    const defenders = [];
    function initDefenders() {
      defenders.length = 0;
      const yPos = [80, 115, 150, 185, 220, 245, 265];
      for (let i = 0; i < 7; i++) {
        defenders.push({
          x: Math.random() * 200 + 30,
          y: yPos[i],
          width: 22,
          height: 6,
          vx: (Math.random() > 0.5 ? 1 : -1) * (1.2 + Math.random() * 1.0)
        });
      }
    }
    initDefenders();

    function moveQB(dx, dy) {
      if (token.inAir) return;
      qbPos.x = Math.max(20, Math.min(canvas.width - 20, qbPos.x + dx));
      qbPos.y = Math.max(lineOfScrimmageY, Math.min(canvas.height - 20, qbPos.y + dy));
      token.x = qbPos.x;
      token.y = qbPos.y;
      playBeep(180, 'square', 0.03);
    }

    function snapOrKick() {
      if (token.inAir || chances <= 0) return;
      token.vx = (Math.random() - 0.5) * 1.5;
      token.vy = -6.8;
      token.inAir = true;
      chances--;
      updateDisplay();
      document.getElementById('status-msg').textContent = 'TOKEN IN FLIGHT!';
      playBeep(300, 'square', 0.08);
    }

    function recordResult(success) {
      if (success) {
        score += 300; passes++;
        document.getElementById('status-msg').textContent = 'GOAL IS GOOD! +300';
        playBeep(523, 'square', 0.15);
      } else {
        misses++;
        document.getElementById('status-msg').textContent = 'NO GOOD! MISSED!';
        playBeep(120, 'sawtooth', 0.15);
      }
      updateDisplay();
      resetToken();
    }

    function resetToken() {
      token.x = qbPos.x; token.y = qbPos.y;
      token.vx = 0; token.vy = 0; token.inAir = false;
      if (chances <= 0) {
        document.getElementById('status-msg').textContent = 'GAME OVER! PRESS RESET.';
        setTimeout(showStats, 500);
      }
    }

    function updateDisplay() {
      document.getElementById('meter-passes').textContent = passes.toString().padStart(2, '0');
      document.getElementById('meter-misses').textContent = misses.toString().padStart(2, '0');
      document.getElementById('meter-chances').textContent = chances.toString().padStart(2, '0');
      document.getElementById('meter-score').textContent = score.toString().padStart(3, '0');
    }

    function resetGame() {
      score = 0; chances = 10; passes = 0; misses = 0;
      document.getElementById('status-msg').textContent = 'READY. SNAP / KICK TOKEN!';
      closeStats(); updateDisplay(); initDefenders(); resetToken();
    }

    function showStats() {
      document.getElementById('stat-score').textContent = score;
      document.getElementById('stat-passes').textContent = passes;
      document.getElementById('stat-misses').textContent = misses;
      let total = passes + misses;
      document.getElementById('stat-rate').textContent = (total > 0 ? Math.round((passes / total) * 100) : 0) + '%';
      document.getElementById('statsModal').classList.add('active');
    }

    function closeStats() { document.getElementById('statsModal').classList.remove('active'); }

    function update() {
      defenders.forEach(d => {
        d.x += d.vx;
        if (d.x < 15 || d.x + d.width > canvas.width - 15) d.vx *= -1;
      });

      if (token.inAir) {
        token.x += token.vx;
        token.y += token.vy;
        token.vy += 0.2;
        token.rotation += 0.15;

        // Defender Collision
        defenders.forEach(d => {
          if (token.x > d.x && token.x < d.x + d.width && token.y > d.y && token.y < d.y + d.height) {
            token.vy *= -0.75; token.vx *= 1.2;
            playBeep(220, 'square', 0.04);
          }
        });

        // Goalpost Check
        if (token.y <= goalpost.crossbarY + 6 && token.y >= goalpost.y - 8) {
          if (token.x >= goalpost.xMin + 4 && token.x <= goalpost.xMax - 4) {
            recordResult(true); return;
          }
        }
        if (token.y > canvas.height + 15 || token.y < 5 || token.x < 0 || token.x > canvas.width) {
          recordResult(false);
        }
      }
    }

    function draw() {
      // Vintage LED Green Grid Background
      ctx.fillStyle = '#041407';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Yard Line Hash Lines
      ctx.strokeStyle = '#0f3818';
      ctx.lineWidth = 1;
      for (let y = 20; y < canvas.height; y += 20) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
      }

      // Line of Scrimmage Boundary
      ctx.strokeStyle = '#39ff14';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(0, lineOfScrimmageY); ctx.lineTo(canvas.width, lineOfScrimmageY); ctx.stroke();

      // Yellow LED Goalpost
      ctx.strokeStyle = '#ffea00'; ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(goalpost.xMin, goalpost.y); ctx.lineTo(goalpost.xMin, goalpost.crossbarY);
      ctx.lineTo(goalpost.xMax, goalpost.crossbarY); ctx.lineTo(goalpost.xMax, goalpost.y);
      ctx.moveTo((goalpost.xMin + goalpost.xMax) / 2, goalpost.crossbarY);
      ctx.lineTo((goalpost.xMin + goalpost.xMax) / 2, goalpost.crossbarY + 15);
      ctx.stroke();

      // Draw 7 Red LED Defender Dashes
      ctx.fillStyle = '#ff2222';
      defenders.forEach(d => {
        ctx.fillRect(d.x, d.y, d.width, d.height);
      });

      // Draw Quarterback LED Marker
      if (!token.inAir) {
        ctx.fillStyle = '#39ff14';
        ctx.fillRect(qbPos.x - 6, qbPos.y - 4, 12, 8);
      }

      // Draw Flying MGM Token
      ctx.save();
      ctx.translate(token.x, token.y);
      ctx.rotate(token.rotation);
      if (mgmCoinImg.complete && mgmCoinImg.naturalWidth > 0) {
        ctx.drawImage(mgmCoinImg, -token.radius, -token.radius, token.radius * 2, token.radius * 2);
      } else {
        ctx.beginPath(); ctx.arc(0, 0, token.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#ffea00'; ctx.fill();
      }
      ctx.restore();
    }

    function loop() { update(); draw(); requestAnimationFrame(loop); }
    loop();
  </script>
</body>
</html>
