<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Party Quarters: You Drink / They Drink Edition</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    body {
      background: #08030c;
      color: #fff;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 10px;
      overflow-x: hidden;
    }

    /* Handheld Shell */
    .handheld-console {
      width: 100%;
      max-width: 380px;
      background: linear-gradient(180deg, #d8ccb0 0%, #b5a482 100%);
      border: 4px solid #544733;
      border-radius: 24px;
      padding: 16px 14px 20px 14px;
      box-shadow: inset 0 2px 5px rgba(255,255,255,0.6), 0 10px 25px rgba(0,0,0,0.8);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Console Branding */
    .brand-plate {
      width: 100%;
      background: #1a0808;
      border: 2px solid #8b0000;
      border-radius: 6px;
      padding: 6px;
      text-align: center;
      margin-bottom: 10px;
      box-shadow: inset 0 0 8px #000;
    }
    .brand-title {
      font-weight: bold;
      font-size: 1.1rem;
      color: #ff3333;
      letter-spacing: 2px;
      text-shadow: 0 0 6px #ff0000;
    }
    .brand-sub {
      font-size: 0.65rem;
      color: #ffd700;
      letter-spacing: 1px;
    }

    /* LED Meters */
    .meters-bezel {
      width: 100%;
      background: #111;
      border: 2px solid #333;
      border-radius: 6px;
      padding: 6px;
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .led-meter {
      background: #050000;
      border: 1px solid #440000;
      padding: 2px 6px;
      border-radius: 4px;
      text-align: center;
    }
    .led-label {
      font-size: 0.55rem;
      color: #888;
      display: block;
    }
    .led-num {
      font-size: 1.1rem;
      color: #ff2222;
      text-shadow: 0 0 6px #ff0000;
      font-weight: bold;
    }

    /* Screen Housing */
    .screen-housing {
      width: 100%;
      background: #0d0614;
      border: 4px solid #231133;
      border-radius: 12px;
      padding: 8px;
      box-shadow: inset 0 0 15px #000;
      position: relative;
    }
    canvas {
      width: 100%;
      height: auto;
      aspect-ratio: 3 / 4;
      display: block;
      background: #150921;
      border-radius: 4px;
    }

    .status-readout {
      margin-top: 6px;
      font-size: 0.75rem;
      color: #ff00ff;
      text-shadow: 0 0 4px #ff00ff;
      text-align: center;
      height: 18px;
      font-weight: bold;
    }

    /* Controls Built-In */
    .control-panel {
      width: 100%;
      margin-top: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 8px;
    }

    .dpad-container {
      display: grid;
      grid-template-columns: repeat(3, 36px);
      grid-template-rows: repeat(3, 36px);
      gap: 2px;
    }
    .dpad-btn {
      background: #333;
      border: 1px solid #111;
      color: #aaa;
      font-size: 0.9rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      box-shadow: inset 0 1px 2px rgba(255,255,255,0.3), 0 3px 0 #111;
      cursor: pointer;
    }
    .dpad-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #111;
      background: #222;
      color: #ff00ff;
    }

    .action-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .big-flip-btn {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ff00aa, #880055);
      border: 3px solid #440022;
      color: #fff;
      font-weight: bold;
      font-size: 0.85rem;
      box-shadow: inset 0 2px 4px rgba(255,255,255,0.4), 0 5px 0 #220011;
      cursor: pointer;
    }
    .big-flip-btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #220011;
    }
    .btn-label {
      font-size: 0.65rem;
      color: #443b2d;
      font-weight: bold;
    }

    .aux-bar {
      margin-top: 12px;
      display: flex;
      gap: 12px;
      width: 100%;
    }
    .aux-btn {
      flex: 1;
      background: #665b49;
      color: #eeddcc;
      border: 1px solid #332d24;
      padding: 6px;
      font-size: 0.7rem;
      font-weight: bold;
      border-radius: 4px;
      box-shadow: 0 2px 0 #221e18;
      cursor: pointer;
    }
    .aux-btn:active {
      transform: translateY(1px);
      box-shadow: 0 1px 0 #221e18;
    }

    /* Party Modal */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.85);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
      z-index: 99;
    }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal {
      background: #111;
      border: 2px solid #ff00ff;
      border-radius: 8px;
      padding: 16px; width: 280px; text-align: center;
    }
    .modal h2 { color: #ff00ff; font-size: 1.2rem; margin-bottom: 10px; }
    .stat-row { display: flex; justify-content: space-between; margin: 6px 0; font-size: 0.85rem; }
  </style>
</head>
<body>

  <div class="handheld-console">
    
    <div class="brand-plate">
      <div class="brand-title">PARTY QUARTERS MAXX</div>
      <div class="brand-sub">MAKE IT = THEY DRINK | MISS = PASS COIN</div>
    </div>

    <!-- LED Meters -->
    <div class="meters-bezel">
      <div class="led-meter">
        <span class="led-label">YOU DRINK</span>
        <span class="led-num" id="meter-youdrink">00</span>
      </div>
      <div class="led-meter">
        <span class="led-label">THEY DRINK</span>
        <span class="led-num" id="meter-theydrink">00</span>
      </div>
      <div class="led-meter">
        <span class="led-label">TURN</span>
        <span class="led-num" id="meter-turn">YOU</span>
      </div>
      <div class="led-meter">
        <span class="led-label">SCORE</span>
        <span class="led-num" id="meter-score">000</span>
      </div>
    </div>

    <!-- Table Screen Display -->
    <div class="screen-housing">
      <canvas id="gameCanvas" width="300" height="380"></canvas>
      <div class="status-readout" id="status-msg">YOUR TURN! AIM & FLIP THE TOKEN!</div>
    </div>

    <!-- Handheld Controls -->
    <div class="control-panel">
      <div class="dpad-container">
        <div></div>
        <button class="dpad-btn" onclick="moveCoin(0, -12)">▲</button>
        <div></div>
        <button class="dpad-btn" onclick="moveCoin(-12, 0)">◄</button>
        <div></div>
        <button class="dpad-btn" onclick="moveCoin(12, 0)">►</button>
        <div></div>
        <button class="dpad-btn" onclick="moveCoin(0, 12)">▼</button>
        <div></div>
      </div>

      <div class="action-group">
        <button class="big-flip-btn" id="flip-btn" onclick="flipCoin()">FLIP</button>
        <span class="btn-label">BOUNCE TOKEN</span>
      </div>
    </div>

    <div class="aux-bar">
      <button class="aux-btn" onclick="resetGame()">NEW MATCH</button>
      <button class="aux-btn" onclick="showStats()">MATCH STATS</button>
    </div>
  </div>

  <div class="modal-overlay" id="statsModal">
    <div class="modal">
      <h2>PARTY MATCH RESULTS</h2>
      <div class="stat-row"><span>SCORE:</span><span id="stat-score">0</span></div>
      <div class="stat-row"><span>THEY DRANK:</span><span id="stat-theydrink">0</span></div>
      <div class="stat-row"><span>YOU DRANK:</span><span id="stat-youdrink">0</span></div>
      <br>
      <button class="aux-btn" onclick="closeStats()">PLAY AGAIN</button>
    </div>
  </div>

  <script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq, type, duration) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type || 'square';
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + duration);
    }

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const bounceLineY = 270;
    let score = 0, yourDrinks = 0, theirDrinks = 0;
    let turn = 'YOU'; // 'YOU' or 'CPU'

    const mgmCoinImg = new Image();
    mgmCoinImg.src = 'tranparent mgm coin1.jpg';

    let token = { x: 150, y: 330, radius: 10, vx: 0, vy: 0, inAir: false, rotation: 0, scale: 1 };
    let startPos = { x: 150, y: 330 };

    const mgmShotGlass = { x: 130, y: 30, w: 40, h: 35 };
    const sideGlasses = [
      { x: 40, y: 80, w: 32, h: 28 },
      { x: 228, y: 80, w: 32, h: 28 },
      { x: 85, y: 130, w: 32, h: 28 },
      { x: 183, y: 130, w: 32, h: 28 }
    ];

    const obstacles = [];
    function initObstacles() {
      obstacles.length = 0;
      const yPos = [170, 210, 240];
      for (let i = 0; i < 3; i++) {
        obstacles.push({
          x: Math.random() * 180 + 30,
          y: yPos[i],
          radius: 12,
          vx: (Math.random() > 0.5 ? 1 : -1) * (1.3 + Math.random() * 0.8)
        });
      }
    }
    initObstacles();

    function moveCoin(dx, dy) {
      if (token.inAir || turn !== 'YOU') return;
      startPos.x = Math.max(20, Math.min(canvas.width - 20, startPos.x + dx));
      startPos.y = Math.max(bounceLineY + 15, Math.min(canvas.height - 20, startPos.y + dy));
      token.x = startPos.x; token.y = startPos.y;
      playBeep(240, 'square', 0.03);
    }

    function flipCoin() {
      if (token.inAir) return;
      if (turn === 'YOU') {
        token.vx = (Math.random() - 0.5) * 1.8;
        token.vy = -7.2;
      } else {
        // CPU Aim Simulation
        token.x = Math.random() * 160 + 70;
        token.y = 330;
        token.vx = (Math.random() - 0.5) * 1.5;
        token.vy = -7.0;
      }
      token.inAir = true;
      document.getElementById('status-msg').textContent = turn + ' BOUNCED THE TOKEN!';
      playBeep(320, 'square', 0.08);
    }

    function recordResult(hitType) {
      if (turn === 'YOU') {
        if (hitType === 'MGM') {
          score += 500; theirDrinks += 2;
          document.getElementById('status-msg').textContent = '★ MGM SHOT! THEY DRINK 2 SHOTS! ★';
          playBeep(659, 'square', 0.2);
        } else if (hitType === 'GLASS') {
          score += 100; theirDrinks++;
          document.getElementById('status-msg').textContent = 'SANK IT! THEY DRINK!';
          playBeep(440, 'square', 0.15);
        } else {
          document.getElementById('status-msg').textContent = 'MISSED! PASSING TO PLAYER 2...';
          turn = 'CPU';
          playBeep(120, 'sawtooth', 0.15);
          setTimeout(cpuTurn, 1600);
        }
      } else {
        // CPU Turn
        if (hitType === 'MGM' || hitType === 'GLASS') {
          yourDrinks++;
          document.getElementById('status-msg').textContent = 'P2 MADE IT! YOU DRINK! 🍺';
          playBeep(200, 'sawtooth', 0.25);
          setTimeout(cpuTurn, 1600);
        } else {
          document.getElementById('status-msg').textContent = 'P2 MISSED! YOUR TURN!';
          turn = 'YOU';
          playBeep(523, 'square', 0.12);
        }
      }
      updateDisplay();
      resetToken();
    }

    function cpuTurn() {
      if (turn !== 'CPU') return;
      document.getElementById('status-msg').textContent = 'PLAYER 2 IS AIMING...';
      setTimeout(flipCoin, 1200);
    }

    function resetToken() {
      startPos = { x: 150, y: 330 };
      token.x = startPos.x; token.y = startPos.y;
      token.vx = 0; token.vy = 0; token.inAir = false; token.scale = 1;
    }

    function updateDisplay() {
      document.getElementById('meter-youdrink').textContent = yourDrinks.toString().padStart(2, '0');
      document.getElementById('meter-theydrink').textContent = theirDrinks.toString().padStart(2, '0');
      document.getElementById('meter-turn').textContent = turn;
      document.getElementById('meter-score').textContent = score.toString().padStart(3, '0');
    }

    function resetGame() {
      score = 0; yourDrinks = 0; theirDrinks = 0; turn = 'YOU';
      document.getElementById('status-msg').textContent = 'YOUR TURN! AIM & FLIP THE TOKEN!';
      closeStats(); updateDisplay(); initObstacles(); resetToken();
    }

    function showStats() {
      document.getElementById('stat-score').textContent = score;
      document.getElementById('stat-theydrink').textContent = theirDrinks;
      document.getElementById('stat-youdrink').textContent = yourDrinks;
      document.getElementById('statsModal').classList.add('active');
    }

    function closeStats() { document.getElementById('statsModal').classList.remove('active'); }

    function update() {
      obstacles.forEach(ob => {
        ob.x += ob.vx;
        if (ob.x < ob.radius + 10 || ob.x > canvas.width - ob.radius - 10) ob.vx *= -1;
      });

      if (token.inAir) {
        token.x += token.vx;
        token.y += token.vy;
        token.vy += 0.22;
        token.rotation += 0.2;
        token.scale = Math.max(0.6, token.scale - 0.003);

        obstacles.forEach(ob => {
          let dist = Math.hypot(token.x - ob.x, token.y - ob.y);
          if (dist < token.radius + ob.radius) {
            token.vy *= -0.8; token.vx *= 1.3;
            playBeep(280, 'square', 0.04);
          }
        });

        // Hit MGM Gold Glass
        if (token.y <= mgmShotGlass.y + mgmShotGlass.h && token.y >= mgmShotGlass.y) {
          if (token.x >= mgmShotGlass.x && token.x <= mgmShotGlass.x + mgmShotGlass.w) {
            recordResult('MGM'); return;
          }
        }

        // Hit Side Glasses
        sideGlasses.forEach(g => {
          if (token.y <= g.y + g.h && token.y >= g.y) {
            if (token.x >= g.x && token.x <= g.x + g.w) {
              recordResult('GLASS'); return;
            }
          }
        });

        if (token.y > canvas.height + 15 || token.y < 5 || token.x < 0 || token.x > canvas.width) {
          recordResult('MISS');
        }
      }
    }

    function draw() {
      ctx.fillStyle = '#170a24';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = '#ff00ff'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(0, bounceLineY); ctx.lineTo(canvas.width, bounceLineY); ctx.stroke();

      // MGM Gold Shot Glass
      ctx.strokeStyle = '#ffd700'; ctx.lineWidth = 3;
      ctx.strokeRect(mgmShotGlass.x, mgmShotGlass.y, mgmShotGlass.w, mgmShotGlass.h);
      ctx.fillStyle = 'rgba(255, 215, 0, 0.25)';
      ctx.fillRect(mgmShotGlass.x, mgmShotGlass.y, mgmShotGlass.w, mgmShotGlass.h);
      ctx.fillStyle = '#ffd700'; ctx.font = '9px monospace';
      ctx.fillText('MGM', mgmShotGlass.x + 10, mgmShotGlass.y + 20);

      // Red Cups (\_/)
      sideGlasses.forEach(g => {
        ctx.strokeStyle = '#ff0055'; ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(g.x, g.y);
        ctx.lineTo(g.x + 5, g.y + g.h);
        ctx.lineTo(g.x + g.w - 5, g.y + g.h);
        ctx.lineTo(g.x + g.w, g.y);
        ctx.closePath();
        ctx.stroke();
        ctx.fillStyle = 'rgba(255, 0, 85, 0.2)';
        ctx.fill();
      });

      // Bouncers
      obstacles.forEach(ob => {
        ctx.beginPath(); ctx.arc(ob.x, ob.y, ob.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#39ff14'; ctx.fill();
      });

      if (!token.inAir) {
        ctx.strokeStyle = turn === 'YOU' ? '#ff00ff' : '#00f0ff';
        ctx.beginPath(); ctx.arc(startPos.x, startPos.y, 12, 0, Math.PI * 2); ctx.stroke();
      }

      // Coin Token
      ctx.save();
      ctx.translate(token.x, token.y);
      ctx.scale(token.scale, token.scale);
      ctx.rotate(token.rotation);
      if (mgmCoinImg.complete && mgmCoinImg.naturalWidth > 0) {
        ctx.drawImage(mgmCoinImg, -token.radius, -token.radius, token.radius * 2, token.radius * 2);
      } else {
        ctx.beginPath(); ctx.arc(0, 0, token.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#ffd700'; ctx.fill();
      }
      ctx.restore();
    }

    function loop() { update(); draw(); requestAnimationFrame(loop); }
    loop();
  </script>
</body>
</html>
